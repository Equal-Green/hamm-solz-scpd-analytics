# Flaming Owl portal theme — crimson accent, iron text, cream/white surfaces,
# 16px rounding. Fonts (Playfair Display / Inter / JetBrains Mono) load via
# injected CSS (dashboard/style.py). Dark iron sidebar is styled there too.
[theme]
base = "light"
primaryColor = "#DC2828"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F4F0"
textColor = "#141414"
linkColor = "#DC2828"
borderColor = "#E4E1DB"
baseRadius = "1rem"
font = "sans-serif"

[server]
headless = true
